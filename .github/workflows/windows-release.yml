name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test MP3, WMA, WAV and fade
        run: python smoke_windows.py
      - name: Build Windows application
        shell: pwsh
        run: ./build_windows.ps1
      - name: Verify packaged application starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath dist/AuralDeck/AuralDeck.exe -PassThru
          Start-Sleep -Seconds 4
          if ($app.HasExited) { throw "Packaged application exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md dist/AuralDeck/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/AuralDeck/THIRD_PARTY_NOTICES.md
          Copy-Item RELEASE_NOTES.md dist/AuralDeck/RELEASE_NOTES.md
          Copy-Item LICENSES dist/AuralDeck/LICENSES -Recurse
          Compress-Archive -Path dist/AuralDeck/* -DestinationPath AuralDeck-Windows-x64.zip
          (Get-FileHash AuralDeck-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  AuralDeck-Windows-x64.zip' | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Obtain FFmpeg source archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz' -OutFile FFmpeg-source-7.1.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: AuralDeck-Windows-x64
          path: |
            AuralDeck-Windows-x64.zip
            SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME AuralDeck-Windows-x64.zip SHA256SUMS.txt FFmpeg-source-7.1.tar.xz --title "Aural Deck $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
